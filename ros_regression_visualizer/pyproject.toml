[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ros-regression-visualizer"
version = "0.1.0"
description = "Visualize relationships between failing ROS packages and recent releases using Mermaid diagrams"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "catkin-pkg>=1.0.0",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
    "rosdistro>=0.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
ros-regression-visualizer = "ros_regression_visualizer.cli:main"
ros_regression_visualizer = "ros_regression_visualizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ros_regression_visualizer"]
